[prepare-backtest]
raw-root = "data/raw/datos_estaciones_5m"
output = "data/smoke_backtests"
folds = 2
train-history = "expanding"
pollutant = "PM25"
context = 90
horizon = 12
stride = 6
train-stride = 6
station = ["AQN1 - Puerto", "AQN3 - Paseo Alfonso XIII"]
max-train-windows = 16
window-policy = "masked"
min-useful = 9
hourly-repeat-filter = 0

[run]
device = "cpu"
num-server-rounds = 3
local-epochs = 1
arrival-period-hours = 24
normalization = "window"
scaler-type = "standard"
probabilistic = 1
batch-size = 8
mlflow-tracking-uri = "disabled"
selection-metric = "macro-mase"

[backtest]
models = ["mlp", "autoencoder", "nlinear", "nhits"]
modes = ["local", "centralized", "federated"]
seeds = [42]
