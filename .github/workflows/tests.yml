name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_models:
        description: Download and validate real pinned foundation checkpoints on CPU
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen pytest -q

  real-models:
    if: github.event_name == 'workflow_dispatch' && inputs.real_models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run --frozen pytest -q tests/test_real_foundations.py
        env:
          FD_AIRQUALITY_REAL_MODELS: '1'
